[package]
name = "stellar-event-assertion"
# Port: the four fields below were `*.workspace = true`, inherited from
# OpenZeppelin's root manifest (version 0.6.0 at 9dd85c30); written out here.
edition = "2021"
license = "MIT"
repository = "https://github.com/OpenZeppelin/stellar-contracts"
publish = false
version = "0.6.0"

[lib]
crate-type = ["lib"]
doctest = false

# This crate is only used for testing, and not compatible with `wasm32` targets.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
stellar-tokens = { workspace = true }
