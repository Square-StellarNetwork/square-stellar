[package]
name = "stellar-tokens"
# Port: the four fields below were `*.workspace = true`, inherited from
# OpenZeppelin's root manifest (version 0.6.0 at 9dd85c30); written out here.
edition = "2021"
license = "MIT"
repository = "https://github.com/OpenZeppelin/stellar-contracts"
version = "0.6.0"
# Port: upstream `publish = true`. A vendored copy is never published.
publish = false
description = "Fungible and NonFungible Tokens for the Stellar contracts."

[lib]
# Port: upstream `["lib", "cdylib"]`. Only the registries are contracts here, so
# `stellar contract build` has no library Wasm to build.
crate-type = ["lib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
# Port: upstream also depends on stellar-contract-utils and stellar-governance.
# Only the modules this port removes use them (fungible, rwa, vault and the
# votes extensions); PORTING.md lists which.

[dev-dependencies]
# Port: upstream also lists ed25519-dalek, soroban-test-helpers, k256 and p256.
# No test of a module kept here uses them.
soroban-sdk = { workspace = true, features = ["testutils"] }
stellar-event-assertion = { workspace = true }
