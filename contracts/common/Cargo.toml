[package]
name = "square-common"
description = "Types, error codes, event schema and storage/TTL helpers the Square contracts share (B1, #8)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
square-test-support = { workspace = true }
serde_json = "1"
