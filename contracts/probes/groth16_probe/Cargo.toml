[package]
name = "groth16_probe"
description = "Measurement behind docs/decisions/groth16-on-soroban.md (#2): a Groth16 proof from the prover, verified with Soroban's BN254 host functions. Not deployed as part of Square; groth16_verifier (#10) is the contract."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
serde_json = "1"
