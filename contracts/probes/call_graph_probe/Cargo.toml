[package]
name = "call_graph_probe"
description = "Measurement behind docs/decisions/call-graph-on-soroban.md (#3): how Soroban treats a callback into a contract already on the stack, a panicking callee, a callee that exhausts the budget and one that returns the wrong type. Not deployed."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
