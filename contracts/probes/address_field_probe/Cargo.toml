[package]
name = "address_field_probe"
description = "Measurement behind docs/decisions/address-field-mapping.md (#4): the address-to-field mapping f computed inside a contract, checked against the vectors the JS implementation writes. Not deployed."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
serde_json = "1"
