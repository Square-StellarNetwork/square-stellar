name: ready labels

# Bir issue kapandiginda ona bagimli olanlar acilabilir hale gelir.
# Bu workflow native issue bagimliliklarini okuyup `ready` ve `blocked`
# etiketlerini yeniden hesaplar.
#
# Ikisi birbirinin tam tersidir ve ayni anda duramaz. Onceden yalnizca
# `ready` yonetiliyordu, `blocked` ise elle konmustu; engelleyicileri
# kapanan issue'larda elle konan etiket kalinca #59 hem `ready` hem
# `blocked` tasir hale geldi ve #58 hicbir etiket almadi (#48).
#
# ATAMALARA DOKUNMAZ. Sahiplik kaynak projeye gore sabittir
# (covenant, aperture, aip) ve issue bloke olsun olmasin gorunur kalir. Sira bilgisini `ready`
# etiketi ve GitHub'in native bagimlilik uyarisi tasir.

on:
  issues:
    types: [closed, reopened, opened]
  workflow_dispatch:
  # Bagimliliklar issue olusturulduktan SONRA eklenirse 'opened' tetiklemesi
  # issue'yu yanlislikla hazir sayar. Saatlik tarama bu surkulenmeyi duzeltir.
  schedule:
    - cron: "17 * * * *"

permissions:
  issues: write

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - name: recompute ready labels
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          script: |
            const {owner, repo} = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });

            for (const issue of issues) {
              if (issue.pull_request) continue;
              const n = issue.number;

              // native bağımlılıklar
              let blockers = [];
              try {
                const r = await github.request(
                  'GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by',
                  {owner, repo, issue_number: n});
                blockers = r.data;
              } catch (e) {
                core.warning(`#${n}: bağımlılık okunamadı (${e.status})`);
                continue;
              }

              const openBlockers = blockers.filter(b => b.state === 'open').map(b => b.number);
              const isReady = openBlockers.length === 0;
              const labels = issue.labels.map(l => l.name);

              // Istenen etiket ile istenmeyen etiket: tek kaynaktan, boylece
              // ikisi ayni issue'da duramaz.
              const want = isReady ? 'ready' : 'blocked';
              const drop = isReady ? 'blocked' : 'ready';

              if (!labels.includes(want)) {
                await github.rest.issues.addLabels({owner, repo, issue_number: n, labels: [want]});
                core.notice(isReady ? `#${n} hazir oldu` : `#${n} bloke: #${openBlockers.join(', #')}`);
              }
              if (labels.includes(drop)) {
                // Etiket arada elle silinmis olabilir; 404 beklenen bir sonuctur.
                await github.rest.issues.removeLabel({owner, repo, issue_number: n, name: drop})
                  .catch(() => {});
                core.notice(`#${n}: ${drop} kaldirildi`);
              }
            }
